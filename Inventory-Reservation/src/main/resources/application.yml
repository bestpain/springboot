spring:
  application:
    name: Inventory-Reservation

  datasource:
    url: jdbc:mysql://localhost:3306/inventory_reservation
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    servlet:
      path: /api/

  flyway:
    enabled: true